<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>زرع بيانات قهوتي</title></head><body style="font-family:Tahoma;text-align:center;padding:48px"><h2>زرع البيانات التجريبية في Firestore</h2><p>افتح هذه الصفحة بعد وضع إعدادات Firebase في <code>js/firebase.js</code></p><button id="go" style="padding:12px 24px;font-size:16px;cursor:pointer">زرع الآن</button><p id="msg"></p><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script>document.getElementById("go").onclick=async()=>{const cafes=[{name:"مقهى الروضة",rating:4.8,time:"20 دقيقة",dist:"1.2 كم",tag:"قهوة مختصة",menu:[{name:"إسبريسو",price:12},{name:"كابتشينو",price:16},{name:"سبانيش لاتيه",price:20},{name:"كرواسون زبدة",price:10}]},{name:"بُن الديرة",rating:4.6,time:"15 دقيقة",dist:"0.8 كم",tag:"قهوة عربية",menu:[{name:"قهوة عربية بالهيل",price:15},{name:"كرك عدني",price:8},{name:"تمر سكري",price:12},{name:"شاي مغربي",price:10}]},{name:"كوفي لايف",rating:4.7,time:"25 دقيقة",dist:"2.1 كم",tag:"مشروبات باردة",menu:[{name:"آيس لاتيه",price:18},{name:"فرابتشينو كراميل",price:22},{name:"كوكيز",price:9},{name:"ماتشا مثلجة",price:21}]}];try{for(const c of cafes)await db.collection("cafes").add(c);document.getElementById("msg").textContent="تم الزرع بنجاح ✅ يمكنك حذف هذه الصفحة الآن."}catch(e){document.getElementById("msg").textContent="خطأ: "+e.message}};</script></body></html>
